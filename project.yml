name: SimpleMotionCapture
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  SimpleMotionCapture:
    type: application
    platform: iOS
    sources: [SimpleMotionCapture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.simplemotioncapture
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        DEVELOPMENT_TEAM: 83VGKGSQUH
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera is used to track body movements for motion capture."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: "arkit"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
